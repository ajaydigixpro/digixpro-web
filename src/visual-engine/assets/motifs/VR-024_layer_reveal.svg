<svg width="100%" height="100%" viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subterranean Base Layer (Deep Blueprint Substrate) -->
  <rect x="70" y="70" width="500" height="360" rx="12" 
        fill="#0F172A" stroke="#007A55" stroke-width="2" />

  <!-- Exposed Circuitry & Telemetry Matrix (Revealed Core) -->
  <line x1="120" y1="120" x2="520" y2="120" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="160" x2="520" y2="160" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="200" x2="520" y2="200" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="240" x2="520" y2="240" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="280" x2="520" y2="280" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="320" x2="520" y2="320" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />
  <line x1="120" y1="360" x2="520" y2="360" stroke="#007A55" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Subterranean High-Velocity Bus Runs -->
  <path d="M 140 140 L 260 140 L 320 220 L 480 220" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <path d="M 180 340 L 300 340 L 360 260 L 500 260" stroke="#6EE7B7" stroke-width="5" stroke-linecap="round" />
  <circle cx="320" cy="220" r="7" fill="#6EE7B7" stroke="#0F172A" stroke-width="2" />
  <circle cx="360" cy="260" r="7" fill="#86EFAC" stroke="#0F172A" stroke-width="2" />

  <!-- Sheared Top Architectural Surface Plate A (Upper-Left Sheared Flange) -->
  <path d="M 50 50 L 360 50 L 220 430 L 50 430 Z" 
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
  <path d="M 50 430 L 220 430 L 235 445 L 65 445 Z" fill="#94A3B8" />
  <path d="M 360 50 L 220 430 L 235 445 L 375 65 Z" fill="#64748B" fill-opacity="0.6" />

  <!-- Plate A Surface Details -->
  <rect x="80" y="90" width="160" height="12" rx="3" fill="#007A55" />
  <rect x="80" y="115" width="90" height="4" rx="2" fill="#0F172A" fill-opacity="0.4" />
  <line x1="80" y1="160" x2="200" y2="160" stroke="#CBD5E1" stroke-width="2" />
  <line x1="80" y1="180" x2="170" y2="180" stroke="#CBD5E1" stroke-width="2" />

  <!-- Sheared Top Architectural Surface Plate B (Lower-Right Offset Flange) -->
  <path d="M 440 70 L 590 70 L 590 450 L 300 450 Z" 
        fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
  <path d="M 440 70 L 300 450 L 285 435 L 425 55 Z" fill="#007A55" fill-opacity="0.3" />

  <!-- Plate B Surface Telemetry Notch -->
  <rect x="420" y="380" width="130" height="14" rx="3" fill="#0F172A" />
  <circle cx="530" cy="387" r="4" fill="#6EE7B7" />

  <!-- Precision Clamping Retaining Brackets -->
  <rect x="250" y="30" width="16" height="35" rx="3" fill="#007A55" stroke="#FFFFFF" stroke-width="1.5" />
  <rect x="330" y="435" width="16" height="35" rx="3" fill="#007A55" stroke="#FFFFFF" stroke-width="1.5" />
</svg>