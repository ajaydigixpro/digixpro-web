<svg width="100%" height="100%" viewBox="0 0 660 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- LAYER 1: Deep Foundation Anchor Plate -->
  <polygon points="80,130 260,70 380,150 200,210" fill="#0F172A" stroke="#007A55" stroke-width="2" />
  <polygon points="80,130 200,210 200,225 80,145" fill="#064E3B" />
  <polygon points="200,210 380,150 380,165 200,225" fill="#0A0A0A" />
  <line x1="120" y1="135" x2="220" y2="100" stroke="#007A55" stroke-width="2" stroke-opacity="0.5" />

  <!-- LAYER 2: Second Cascading Step -->
  <polygon points="160,210 340,150 460,230 280,290" fill="#064E3B" stroke="#059669" stroke-width="2" />
  <polygon points="160,210 280,290 280,305 160,225" fill="#0F172A" />
  <polygon points="280,290 460,230 460,245 280,305" fill="#064E3B" />
  <line x1="160" y1="210" x2="280" y2="290" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" />

  <!-- LAYER 3: Primary Commercial Processing Plane -->
  <polygon points="240,290 420,230 540,310 360,370" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
  <polygon points="240,290 360,370 360,388 240,308" fill="#064E3B" />
  <polygon points="360,370 540,310 540,328 360,388" fill="#0F172A" />
  <line x1="280" y1="295" x2="400" y2="255" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" />
  <line x1="330" y1="325" x2="450" y2="285" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 5" stroke-linecap="round" />
  <line x1="240" y1="290" x2="360" y2="370" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- LAYER 4: Apex Modernized Slab -->
  <polygon points="320,370 500,310 600,380 420,440" fill="#6EE7B7" stroke="#007A55" stroke-width="2" />
  <polygon points="320,370 420,440 420,458 320,388" fill="#007A55" />
  <polygon points="420,440 600,380 600,398 420,458" fill="#064E3B" />
  <rect x="400" y="360" width="80" height="24" rx="4" transform="skewY(-18)" fill="#FFFFFF" fill-opacity="0.8" />
  <circle cx="430" cy="410" r="6" fill="#0F172A" />

  <!-- Stepped Cascading Transit Bus -->
  <path d="M 230 140 L 310 220 L 390 300 L 470 375" 
        stroke="#86EFAC" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
  <circle cx="230" cy="140" r="4" fill="#6EE7B7" />
  <circle cx="310" cy="220" r="4" fill="#6EE7B7" />
  <circle cx="390" cy="300" r="5" fill="#FFFFFF" />
  <circle cx="470" cy="375" r="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />
</svg>