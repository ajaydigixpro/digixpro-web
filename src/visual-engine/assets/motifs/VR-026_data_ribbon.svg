<svg width="100%" height="100%" viewBox="0 0 680 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ribbon Segment 1: Inflow Tail (Starts Lower-Left, angles up) -->
  <polygon points="60,340 180,240 210,265 90,365" fill="#064E3B" />
  <polygon points="60,340 90,365 70,390 40,365" fill="#0F172A" />

  <!-- Ribbon Segment 2: Primary Forward Planar Sweep (Broad Upper Face) -->
  <polygon points="180,240 420,120 450,145 210,265" fill="#007A55" />
  <line x1="195" y1="245" x2="425" y2="130" stroke="#6EE7B7" stroke-width="3.5" stroke-linecap="round" />
  <line x1="205" y1="258" x2="435" y2="142" stroke="#86EFAC" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" />

  <!-- Ribbon Segment 3: Sharp Fold Downward (Beveled Drop Face) -->
  <polygon points="420,120 490,120 490,260 420,260" fill="#059669" />
  <polygon points="450,145 520,145 520,285 450,285" fill="#064E3B" fill-opacity="0.6" />
  <polygon points="420,120 450,145 450,285 420,260" fill="#6EE7B7" />

  <!-- Ribbon Segment 4: Under-Loop Returning Left (Depth Plane) -->
  <polygon points="420,260 260,340 290,365 450,285" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />

  <!-- Ribbon Segment 5: Outward Terminal Thrust (Snapping to Right Baseline) -->
  <polygon points="260,340 580,340 610,365 290,365" fill="#007A55" />
  <polygon points="260,340 580,340 595,330 275,330" fill="#86EFAC" />

  <!-- Terminal Signal Acceleration Track -->
  <line x1="280" y1="352" x2="590" y2="352" stroke="#6EE7B7" stroke-width="4" stroke-linecap="round" />
  <line x1="320" y1="358" x2="560" y2="358" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 8" />

  <!-- Dimensional Edge Bevel Accents -->
  <line x1="180" y1="240" x2="210" y2="265" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
  <line x1="420" y1="120" x2="450" y2="145" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
  <line x1="420" y1="260" x2="450" y2="285" stroke="#86EFAC" stroke-width="2" />
  <line x1="260" y1="340" x2="290" y2="365" stroke="#6EE7B7" stroke-width="2" />

  <circle cx="530" cy="180" r="5" fill="#6EE7B7" />
  <circle cx="560" cy="210" r="3.5" fill="#86EFAC" />
  <circle cx="585" cy="235" r="2.5" fill="#007A55" />
</svg>