<svg width="100%" height="100%" viewBox="0 0 700 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Inflow Channel 1: High Origin (Angles down 45 deg, snaps to parallel) -->
  <path d="M 60 70 L 220 70 L 340 180 L 460 180 L 640 180" 
        stroke="#0F172A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60 70 L 220 70 L 340 180 L 460 180 L 640 180" 
        stroke="#86EFAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" stroke-opacity="0.85" />

  <!-- Inflow Channel 2: Mid-High Ribbon (Emerald Structural Layer) -->
  <path d="M 90 150 L 240 150 L 330 205 L 640 205" 
        stroke="#007A55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 90 150 L 240 150 L 330 205 L 640 205" 
        stroke="#6EE7B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inflow Channel 3: Center Core Primary Conduit (Heavy Solid Emerald) -->
  <path d="M 60 230 L 260 230 L 320 230 L 640 230" 
        stroke="#064E3B" stroke-width="26" stroke-linecap="round" />
  <path d="M 60 230 L 260 230 L 320 230 L 640 230" 
        stroke="#059669" stroke-width="14" stroke-linecap="round" />
  <path d="M 280 230 L 640 230" 
        stroke="#6EE7B7" stroke-width="4" stroke-linecap="round" />

  <!-- Inflow Channel 4: Low Origin (Angles up 45 deg, enters convergence hub) -->
  <path d="M 80 370 L 210 370 L 320 255 L 640 255" 
        stroke="#007A55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 370 L 210 370 L 320 255 L 640 255" 
        stroke="#86EFAC" stroke-width="3" stroke-dasharray="12 6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inflow Channel 5: Deep Bed Low Sweep -->
  <path d="M 120 410 L 240 410 L 350 280 L 480 280 L 640 280" 
        stroke="#0F172A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6" />

  <!-- Convergence Compression Collar / Throttle Clamp -->
  <rect x="310" y="160" width="30" height="140" rx="6" 
        fill="#0F172A" stroke="#007A55" stroke-width="2" />
  <line x1="325" y1="170" x2="325" y2="290" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" />

  <!-- Unified Output Accelerating Terminal -->
  <path d="M 600 165 L 645 230 L 600 295 Z" fill="#007A55" />
  <path d="M 615 190 L 645 230 L 615 270 Z" fill="#6EE7B7" />

  <!-- Staggered Entry Metric Vernier Indicators -->
  <circle cx="60" cy="70" r="7" fill="#0F172A" stroke="#86EFAC" stroke-width="2" />
  <circle cx="90" cy="150" r="6" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
  <circle cx="60" cy="230" r="8" fill="#064E3B" stroke="#6EE7B7" stroke-width="3" />
  <circle cx="80" cy="370" r="6" fill="#007A55" stroke="#86EFAC" stroke-width="2" />
  <circle cx="120" cy="410" r="5" fill="#0F172A" stroke="#94A3B8" stroke-width="2" />
</svg>