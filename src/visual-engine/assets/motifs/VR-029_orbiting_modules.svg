<svg width="100%" height="100%" viewBox="0 0 620 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Central Enterprise Engine Core -->
  <g transform="translate(300, 270)">
    <rect x="-55" y="-55" width="110" height="110" rx="16" fill="#0F172A" stroke="#007A55" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#064E3B" stroke="#6EE7B7" stroke-width="2" />
    <polygon points="0,-24 21,12 -21,12" fill="#6EE7B7" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>

  <!-- Orbital Track 1: Tight Inner Ellipse (Tilted -20 deg) -->
  <ellipse cx="300" cy="270" rx="140" ry="85" 
           stroke="#007A55" stroke-width="2" fill="none" transform="rotate(-20 300 270)" />
  <ellipse cx="300" cy="270" rx="140" ry="85" 
           stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="8 6" fill="none" transform="rotate(-20 300 270)" stroke-opacity="0.7" />

  <!-- Orbital Track 2: Wide Mid Ellipse (Tilted 25 deg) -->
  <ellipse cx="300" cy="270" rx="220" ry="125" 
           stroke="#0F172A" stroke-width="2.5" fill="none" transform="rotate(25 300 270)" stroke-opacity="0.5" />
  <ellipse cx="300" cy="270" rx="220" ry="125" 
           stroke="#007A55" stroke-width="2" stroke-dasharray="16 10" fill="none" transform="rotate(25 300 270)" />

  <!-- Orbital Track 3: Peripheral Halo Perimeter (Tilted -10 deg) -->
  <ellipse cx="300" cy="270" rx="280" ry="160" 
           stroke="#059669" stroke-width="1.5" stroke-dasharray="4 6" fill="none" transform="rotate(-10 300 270)" stroke-opacity="0.4" />

  <!-- ORBITING SATELLITE MODULES -->
  <g transform="translate(390, 185) rotate(-20)">
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="18" cy="0" r="3" fill="#6EE7B7" />
  </g>

  <g transform="translate(130, 335) rotate(25)">
    <rect x="-26" y="-18" width="52" height="36" rx="5" fill="#0F172A" stroke="#007A55" stroke-width="2.5" />
    <rect x="-18" y="-8" width="36" height="16" rx="2" fill="#064E3B" />
    <circle cx="0" cy="0" r="4" fill="#86EFAC" />
    <line x1="-34" y1="0" x2="-26" y2="0" stroke="#6EE7B7" stroke-width="3" />
    <line x1="26" y1="0" x2="34" y2="0" stroke="#6EE7B7" stroke-width="3" />
  </g>

  <g transform="translate(140, 150) rotate(-10)">
    <polygon points="0,-16 16,12 -16,12" fill="#059669" stroke="#6EE7B7" stroke-width="2" />
    <circle cx="0" cy="4" r="3" fill="#FFFFFF" />
  </g>

  <g transform="translate(490, 360) rotate(25)">
    <rect x="-22" y="-15" width="44" height="30" rx="4" fill="#007A55" stroke="#6EE7B7" stroke-width="2.5" />
    <line x1="-14" y1="-5" x2="14" y2="-5" stroke="#6EE7B7" stroke-width="2" />
    <line x1="-14" y1="5" x2="6" y2="5" stroke="#86EFAC" stroke-width="2" />
    <circle cx="12" cy="5" r="3" fill="#FFFFFF" />
  </g>

  <path d="M 405 170 L 425 155" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
  <path d="M 120 355 L 105 375" stroke="#86EFAC" stroke-width="2" stroke-linecap="round" />
</svg>