    <polygon points="0,-75 70,-35 0,-10 -70,-35" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="1.5" />
    <polygon points="0,-10 70,-35 70,35 0,60" fill="#059669" />
    <polygon points="0,-10 -70,-35 -70,35 0,60" fill="#064E3B" />
    <circle cx="0" cy="20" r="16" fill="#FFFFFF" stroke="#007A55" stroke-width="2.5" />
    <circle cx="0" cy="20" r="7" fill="#6EE7B7" />
    <circle cx="0" cy="20" r="3" fill="#0F172A" />
  </g>

  <!-- State Indicator Stage Rails -->
  <line x1="80" y1="360" x2="200" y2="360" stroke="#94A3B8" stroke-width="2" />
  <line x1="310" y1="360" x2="430" y2="360" stroke="#007A55" stroke-width="3" />
  <line x1="540" y1="360" x2="660" y2="360" stroke="#6EE7B7" stroke-width="4" />
