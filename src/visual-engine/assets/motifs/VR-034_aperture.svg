<svg width="100%" height="100%" viewBox="0 0 580 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Concentric Calibration Chassis (Stronger border presence) -->
  <circle cx="290" cy="270" r="235" stroke="#0F172A" stroke-width="3.5" fill="none" />
  <circle cx="290" cy="270" r="220" stroke="#007A55" stroke-width="2" stroke-dasharray="8 6" fill="none" />
  
  <!-- Outer Radial Calibration Marks (12 Ticks at 30 deg) -->
  <g transform="translate(290, 270)" stroke="#007A55" stroke-width="2.5">
    <line x1="0" y1="-235" x2="0" y2="-215" />
    <line x1="117" y1="-203" x2="107" y2="-186" />
    <line x1="203" y1="-117" x2="186" y2="-107" />
    <line x1="235" y1="0" x2="215" y2="0" />
    <line x1="203" y1="117" x2="186" y2="107" />
    <line x1="117" y1="203" x2="107" y2="186" />
    <line x1="0" y1="235" x2="0" y2="215" />
    <line x1="-117" y1="203" x2="-107" y2="186" />
    <line x1="-203" y1="117" x2="-186" y2="107" />
    <line x1="-235" y1="0" x2="-215" y2="0" />
    <line x1="-203" y1="-117" x2="-186" y2="-107" />
    <line x1="-117" y1="-203" x2="-107" y2="-186" />
  </g>

  <!-- 6 INTERLOCKING ARCHITECTURAL IRIS BLADES (With crisp beveled outer contours) -->
  <g transform="translate(290, 270)">
    <!-- Blade 1 (0 deg) -->
    <path d="M 0,-75 L 120,-170 L 195,-80 L 75,-40 Z" fill="#0F172A" stroke="#007A55" stroke-width="2.5" />
    <!-- Blade 2 (60 deg) -->
    <path d="M 65,-37 L 195,-80 L 180,45 L 75,40 Z" fill="#064E3B" stroke="#059669" stroke-width="2.5" />
    <!-- Blade 3 (120 deg) -->
    <path d="M 65,37 L 180,45 L 85,190 L 0,75 Z" fill="#007A55" stroke="#064E3B" stroke-width="2.5" />
    <!-- Blade 4 (180 deg) -->
    <path d="M 0,75 L 85,190 L -75,190 L -65,37 Z" fill="#059669" stroke="#6EE7B7" stroke-width="2.5" />
    <!-- Blade 5 (240 deg) -->
    <path d="M -65,37 L -75,190 L -195,80 L -75,-40 Z" fill="#007A55" stroke="#064E3B" stroke-width="2.5" />
    <!-- Blade 6 (300 deg) -->
    <path d="M -65,-37 L -195,80 L -120,-170 L 0,-75 Z" fill="#064E3B" stroke="#059669" stroke-width="2.5" />

    <!-- Blade Bevel Highlights -->
    <line x1="0" y1="-75" x2="120" y2="-170" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" />
    <line x1="65" y1="-37" x2="195" y2="-80" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" />
    <line x1="65" y1="37" x2="180" y2="45" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="75" x2="85" y2="190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="-65" y1="37" x2="-75" y2="190" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-65" y1="-37" x2="-195" y2="80" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Luminous Aperture Core -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" 
             fill="#6EE7B7" stroke="#FFFFFF" stroke-width="3.5" />
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="14" fill="#007A55" />
    <circle cx="0" cy="0" r="5" fill="#6EE7B7" />
  </g>
</svg>