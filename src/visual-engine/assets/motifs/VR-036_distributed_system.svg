<svg width="100%" height="100%" viewBox="0 0 660 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dual-Rail Orthogonal Bus Highways -->
  <!-- Top Highway Rail -->
  <path d="M 80 110 L 320 110 L 320 260 L 560 260" 
        stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 110 L 320 110 L 320 260 L 560 260" 
        stroke="#007A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 110 L 320 110 L 320 260 L 560 260" 
        stroke="#6EE7B7" stroke-width="1" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Highway Rail -->
  <path d="M 80 390 L 220 390 L 220 260 L 320 260" 
        stroke="#007A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 220 390 L 460 390 L 460 260" 
        stroke="#007A55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 460 390 L 560 390" 
        stroke="#007A55" stroke-width="3" stroke-linecap="round" />

  <!-- Cross Interconnect Feeder (North-East Loop) -->
  <path d="M 320 260 L 460 260 L 460 120 L 560 120" 
        stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 460 260 L 460 120" 
        stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Consensus Bounding Sub-Cluster Frames (Zonal Enclosures) -->
  <!-- Zone A (Upper-Left Cluster Enclosure) -->
  <rect x="60" y="70" width="160" height="110" rx="8" fill="none" stroke="#007A55" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.35" />
  <!-- Zone B (Lower-Right Cluster Enclosure) -->
  <rect x="420" y="320" width="180" height="130" rx="8" fill="none" stroke="#007A55" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.35" />

  <!-- PRIMARY CONSENSUS CORE (Center Engine Cluster: x: 260-380, y: 200-320) -->
  <rect x="260" y="200" width="120" height="120" rx="18" 
        fill="#0F172A" stroke="#007A55" stroke-width="4" />
  <rect x="280" y="220" width="80" height="80" rx="10" 
        fill="#007A55" stroke="#6EE7B7" stroke-width="2.5" />
  <rect x="300" y="240" width="40" height="40" rx="6" fill="#064E3B" />
  <circle cx="320" cy="260" r="11" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="320" cy="260" r="4" fill="#0F172A" />

  <!-- SECONDARY REGIONAL CLUSTER PODS -->
  <!-- Pod 1 (Upper-Left: x: 110, y: 110) -->
  <rect x="75" y="75" width="70" height="70" rx="10" 
        fill="#064E3B" stroke="#059669" stroke-width="2.5" />
  <rect x="90" y="90" width="40" height="40" rx="5" fill="#007A55" />
  <circle cx="110" cy="110" r="6" fill="#86EFAC" />

  <!-- Pod 2 (Upper-Right Regional Apex: x: 540, y: 120) -->
  <rect x="505" y="85" width="75" height="75" rx="12" 
        fill="#007A55" stroke="#6EE7B7" stroke-width="3" />
  <rect x="522" y="102" width="41" height="41" rx="6" fill="#0F172A" />
  <circle cx="542.5" cy="122.5" r="8" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="2" />

  <!-- Pod 3 (Lower-Right Ingestion Gateway: x: 520, y: 390) -->
  <rect x="480" y="350" width="80" height="80" rx="12" 
        fill="#0F172A" stroke="#007A55" stroke-width="3" />
  <rect x="498" y="368" width="44" height="44" rx="6" fill="#064E3B" stroke="#6EE7B7" stroke-width="1.5" />
  <circle cx="520" cy="390" r="7" fill="#6EE7B7" />

  <!-- Pod 4 (Lower-Left Storage Vault: x: 120, y: 390) -->
  <rect x="85" y="355" width="70" height="70" rx="10" 
        fill="#007A55" stroke="#064E3B" stroke-width="2.5" />
  <rect x="100" y="370" width="40" height="40" rx="5" fill="#064E3B" />
  <circle cx="120" cy="390" r="6" fill="#86EFAC" />

  <!-- TERTIARY EDGE SATELLITES (Evenly Balanced in Coordinate Field) -->
  <!-- Sat 1 (Mid-Left Relay) -->
  <rect x="205" y="375" width="30" height="30" rx="5" fill="#0F172A" stroke="#6EE7B7" stroke-width="2" />
  <circle cx="220" cy="390" r="4" fill="#6EE7B7" />
  <!-- Sat 2 (Mid-Right Relay) -->
  <rect x="445" y="245" width="30" height="30" rx="5" fill="#007A55" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="460" cy="260" r="4" fill="#FFFFFF" />
  <!-- Sat 3 (Top-Mid Beacon) -->
  <rect x="305" y="60" width="30" height="30" rx="5" fill="#059669" stroke="#86EFAC" stroke-width="2" />
  <circle cx="320" cy="75" r="4" fill="#86EFAC" />
  <line x1="320" y1="90" x2="320" y2="110" stroke="#007A55" stroke-width="2" />
  <!-- Sat 4 (Bottom-Mid Relay) -->
  <rect x="305" y="430" width="30" height="30" rx="5" fill="#0F172A" stroke="#007A55" stroke-width="2" />
  <circle cx="320" cy="445" r="4" fill="#6EE7B7" />
  <line x1="320" y1="410" x2="320" y2="430" stroke="#007A55" stroke-width="2" />
</svg>