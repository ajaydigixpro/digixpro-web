<svg width="100%" height="100%" viewBox="0 0 640 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diagonal Fault Line / Transformation Axis (30 deg shear) -->
  <line x1="120" y1="460" x2="480" y2="40" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="110" y1="465" x2="470" y2="45" stroke="#007A55" stroke-width="1" stroke-opacity="0.4" />

  <!-- UNTRANSFORMED REGION (Lower-Left: Rigid Monolithic Grid) -->
  <rect x="80" y="320" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="145" y="320" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="80" y="370" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="145" y="370" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="210" y="370" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="80" y="420" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="145" y="420" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="210" y="420" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />
  <rect x="275" y="420" width="55" height="40" rx="3" fill="#0F172A" stroke="#007A55" stroke-width="1.5" />

  <!-- Boundary Transition Nodes directly on the fault line -->
  <circle cx="210" cy="355" r="5" fill="#059669" stroke="#0F172A" stroke-width="2" />
  <circle cx="280" cy="275" r="6" fill="#6EE7B7" stroke="#0F172A" stroke-width="2" />
  <circle cx="350" cy="195" r="7" fill="#86EFAC" stroke="#007A55" stroke-width="2" />
  <circle cx="420" cy="115" r="6" fill="#6EE7B7" stroke="#0F172A" stroke-width="2" />

  <!-- TRANSFORMED / SHIFTED REGION (Upper-Right: Elevated, Sheared, Modernized) -->
  <polygon points="250,290 310,270 350,300 290,320" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
  <polygon points="320,265 380,245 420,275 360,295" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
  <polygon points="390,240 450,220 490,250 430,270" fill="#059669" stroke="#86EFAC" stroke-width="2" />

  <polygon points="290,210 350,190 390,220 330,240" fill="#064E3B" stroke="#007A55" stroke-width="2" />
  <polygon points="360,185 420,165 460,195 400,215" fill="#007A55" stroke="#6EE7B7" stroke-width="2" />
  <polygon points="430,160 490,140 530,170 470,190" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="2" />

  <polygon points="330,130 390,110 430,140 370,160" fill="#059669" stroke="#6EE7B7" stroke-width="2" />
  <polygon points="400,105 460,85 500,115 440,135" fill="#6EE7B7" stroke="#0F172A" stroke-width="2" />
  <polygon points="470,80 530,60 570,90 510,110" fill="#FFFFFF" stroke="#007A55" stroke-width="2.5" />

  <!-- Inter-Phase Bridge Vectors -->
  <line x1="200" y1="370" x2="270" y2="310" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" />
  <line x1="265" y1="420" x2="335" y2="280" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="135" y1="320" x2="310" y2="210" stroke="#007A55" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6" />
</svg>